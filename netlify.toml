# Statische SPA: ssr staat uit, dus `nuxt generate` levert een map met bestanden.
# SUPABASE_URL en SUPABASE_KEY zet je in Netlify onder Site settings ->
# Environment variables, niet in de repo.
[build]
  command = "npm run generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  # Zonder dit kiest Nitro op Netlify vanzelf het preset `netlify-static`, dat
  # naar dist/ schrijft in plaats van naar .output/public — en dan faalt de
  # deploy op een map die niet bestaat. Vastzetten houdt lokaal en CI gelijk.
  NITRO_PRESET = "static"
